services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: doonce
      POSTGRES_USER: doonce
      POSTGRES_PASSWORD: doonce-dev-password
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doonce -d doonce"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - doonce-postgres-data:/var/lib/postgresql/data
      - ./database/init/01-runtime-role.sql:/docker-entrypoint-initdb.d/01-runtime-role.sql:ro

volumes:
  doonce-postgres-data:
