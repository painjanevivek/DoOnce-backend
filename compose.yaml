services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: doonce
      POSTGRES_USER: doonce
      POSTGRES_PASSWORD: doonce-dev-password
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doonce -d doonce"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - doonce-postgres-data:/var/lib/postgresql/data

volumes:
  doonce-postgres-data:
