name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run governance:verify
      - run: npm test
      - run: npm run security:verify -- --release
      - run: npm run build
      - run: docker build --tag doonce-backend:ci .
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: doonce-backend-security-evidence
          path: security-evidence/
          if-no-files-found: error
          retention-days: 30

  recovery:
    name: Migration and backup restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: doonce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d doonce"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGPASSWORD: postgres
      MIGRATIONS_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/doonce
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/doonce
      TEST_APP_DATABASE_URL: postgres://doonce_app:doonce-app@127.0.0.1:5432/doonce
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Create the restricted RLS application role
        run: psql --host 127.0.0.1 --username postgres --dbname doonce --command "CREATE ROLE doonce_app LOGIN PASSWORD 'doonce-app' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS"
      - run: npm run db:migrate
      - name: Verify live membership, tenant isolation, and approval concurrency
        run: |
          mkdir -p security-evidence
          set -o pipefail
          npm run test:postgres-security | tee security-evidence/postgres-security.tap
      - name: Back up and restore into an isolated database
        run: |
          pg_dump --host 127.0.0.1 --username postgres --dbname doonce --format custom --file doonce.backup
          createdb --host 127.0.0.1 --username postgres doonce_restore
          pg_restore --host 127.0.0.1 --username postgres --dbname doonce_restore --exit-on-error doonce.backup
          source_count=$(psql --host 127.0.0.1 --username postgres --dbname doonce --tuples-only --no-align --command "SELECT count(*) FROM schema_migrations")
          restore_count=$(psql --host 127.0.0.1 --username postgres --dbname doonce_restore --tuples-only --no-align --command "SELECT count(*) FROM schema_migrations")
          test "$source_count" = "$restore_count"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: doonce-postgres-security-evidence
          path: security-evidence/
          if-no-files-found: error
          retention-days: 30

  supply-chain:
    name: Dependency, image, and SBOM checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - name: Generate CycloneDX software bill of materials
        run: npm sbom --sbom-format cyclonedx > doonce-backend.sbom.json
      - run: docker build --tag doonce-backend:ci .
      - name: Scan production container
        id: image-scan
        continue-on-error: true
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: doonce-backend:ci
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
      - name: Inspect container scan report
        if: always()
        run: cat "${{ steps.image-scan.outputs.sarif }}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: doonce-backend-sbom
          path: doonce-backend.sbom.json
          retention-days: 30
      - name: Enforce critical container vulnerability gate
        if: steps.image-scan.outcome == 'failure'
        run: exit 1
